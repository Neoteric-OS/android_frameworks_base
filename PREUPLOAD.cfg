                      core/java/com/android/server/net/
                      graphics/java/android
                      core/tests/coretests/src/android/
                      packages/CaptivePortalLogin/
                      packages/PrintRecommendationService/
                      packages/PrintSpooler/
                      services/core/java/com/android/server/ConnectivityService.java
                      services/core/java/com/android/server/NetworkManagementService.java
                      services/core/java/com/android/server/NsdService.java
                      services/core/java/com/android/server/connectivity/
                      services/net/
                      services/print/
                      services/usb/
                      telephony/
                      tests/net/

